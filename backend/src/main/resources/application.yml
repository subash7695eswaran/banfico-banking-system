server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: banfico-banking-system
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:banfico_banking}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8081}/realms/banfico-realm
          jwk-set-uri: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8081}/realms/banfico-realm/protocol/openid-connect/certs

# Actuator & Health Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Banking Business Rules & Maker-Checker Settings
banking:
  currency: INR
  symbol: "₹"
  maker-checker:
    approval-threshold-inr: 50000.00

# App Metadata
app:
  version: 1.0.0
  name: Banfico Mini Banking System
  description: Open Banking Consent Management & Core Banking Platform
  program: Banfico University Full-Stack Training

