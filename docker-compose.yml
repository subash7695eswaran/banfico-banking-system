version: '3.8'

services:
  # =================================================================
  # 1. PostgreSQL Database
  # =================================================================
  postgres:
    image: postgres:16-alpine
    container_name: banfico-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-banfico_banking}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    networks:
      - banfico-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-banfico_banking}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =================================================================
  # 2. Keycloak Identity & Access Management (Week 4)
  # =================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: banfico-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: 8081
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8081:8081"
    networks:
      - banfico-network
    depends_on:
      postgres:
        condition: service_healthy

  # =================================================================
  # 3. Spring Boot Backend Service (Week 1-2)
  # =================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: banfico-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-banfico_banking}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8081
    ports:
      - "8082:8080"
    networks:
      - banfico-network
    depends_on:
      postgres:
        condition: service_healthy

  # =================================================================
  # 4. Frontend Web App (Week 3)
  # =================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: banfico-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - banfico-network

  # =================================================================
  # 5. Nginx API Gateway (Week 5)
  # =================================================================
  nginx-gateway:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: banfico-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - banfico-network
    depends_on:
      - backend
      - frontend
      - keycloak

networks:
  banfico-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
